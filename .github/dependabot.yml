version: 2
updates:
  # GitHub Actions only. Helm Chart.yaml + values.yaml image pins are owned by Renovate
  # (helmv3 + helm-values). Dependabot's helm ecosystem collapses chart name `postgres`
  # with image repository `postgres` and rewrites tags to chart versions (#556).
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
