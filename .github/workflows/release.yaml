name: Release Charts

on:
  push:
    branches:
      - master
      # Releases backports from a release branch without merging to master.
      # workflow_dispatch is not usable here: GitHub only offers it when the
      # trigger is present on the default branch.
      - 'release-**'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup git credentials
        uses: oleksiyrudenko/gha-git-credentials@v2.1.2
        with:
          name: 'reportportal.io'
          email: 'support@reportportal.io'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: .
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
