{{- if and (include "reportportal.prime.scim.enabled" .) .Values.prime.scim.autoscaling.enabled }}
{{- $fullname := include "reportportal.prime.fullname" (dict "root" . "suffix" "scim") -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}
  labels: {{ include "labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}
  minReplicas: {{ .Values.prime.scim.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.prime.scim.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.prime.scim.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.prime.scim.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.prime.scim.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.prime.scim.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
