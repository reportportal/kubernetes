{{- if and (include "reportportal.premium.testExecutions.enabled" .) .Values.premium.testExecutions.log4j2.enabled }}
{{- $fullname := include "reportportal.premium.fullname" (dict "root" . "suffix" "test-executions") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-log4j
  labels: {{ include "labels" . | nindent 4 }}
data:
  log4j2.properties: |
{{- .Values.premium.testExecutions.log4j2.properties | nindent 4 }}
{{- end }}
